<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Brooklyn Films – Interactive Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>

  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: rgba(0,0,0,.08);
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      background: var(--bg);
    }
    #app {
      height: 100%;
      display: grid;
      grid-template-columns: 360px 1fr;
    }
    #sidebar {
      border-right: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 2px 0 12px var(--shadow);
      display: flex;
      flex-direction: column;
      min-width: 280px;
    }
    #sidebar header {
      padding: 14px 14px 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    #title {
      font-size: 16px;
      font-weight: 650;
      margin: 0 0 6px 0;
      letter-spacing: .2px;
    }
    #subtitle {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.3;
    }
    #controls {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 10px;
    }
    #search {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 10px;
      font-size: 14px;
      outline: none;
    }
    #search:focus {
      border-color: #cbd5e1;
      box-shadow: 0 0 0 3px rgba(148,163,184,.25);
    }
    .toggleRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
    .toggleRow label {
      color: var(--text);
    }
    .pill {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    #list {
      overflow: auto;
      padding: 6px 0;
    }
    .filmItem {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .filmItem:hover {
      background: #f9fafb;
    }
    .filmName {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    .filmMeta {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.25;
    }
    #map {
      height: 100%;
      width: 100%;
      background: #f3f4f6;
    }
    #status {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      font-size: 12px;
      color: var(--muted);
      z-index: 9999;
      max-width: 320px;
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 13px;
      line-height: 1.35;
    }
    .popupTitle {
      font-weight: 700;
      margin: 0 0 6px 0;
      font-size: 14px;
    }
    .popupLine {
      margin: 2px 0;
      color: #111827;
    }
    .popupMuted {
      color: var(--muted);
    }
    @media (max-width: 860px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 280px 1fr;
      }
      #sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1 id="title">Brooklyn filming locations</h1>
        <p id="subtitle">Markers are derived from the report’s “Key Brooklyn locations” fields and may be neighborhood-level when a precise address was not documented.</p>
      </header>

      <div id="controls">
        <input id="search" type="search" placeholder="Search films… (e.g., Do the Right Thing)" autocomplete="off"/>
        <div class="toggleRow">
          <label><input id="toggleFeatures" type="checkbox" checked/> Feature films</label>
          <span class="pill" id="countFeatures">0</span>
        </div>
        <div class="toggleRow">
          <label><input id="toggleShorts" type="checkbox" checked/> Shorts / actualities</label>
          <span class="pill" id="countShorts">0</span>
        </div>
      </div>

      <div id="list"></div>
    </aside>

    <main style="position: relative;">
      <div id="map"></div>
      <div id="status">Loading…</div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>

  <script>
    const POINTS = [{"film": "Awakenings", "year": 1990, "director": "Penny Marshall", "location_label": "Kingsboro Psychiatric Center", "query": "Kingsboro Psychiatric Center, Brooklyn, NY", "type": "Feature film"}, {"film": "Awakenings", "year": 1990, "director": "Penny Marshall", "location_label": "Park Slope brownstone", "query": "Park Slope, Brooklyn, NY", "type": "Feature film"}, {"film": "Brighton Beach Memoirs", "year": 1986, "director": "Gene Saks", "location_label": "4th Street, Brighton Beach", "query": "Brighton 4th Street, Brooklyn, NY", "type": "Feature film"}, {"film": "Brighton Beach Memoirs", "year": 1986, "director": "Gene Saks", "location_label": "Coney Island", "query": "Coney Island, Brooklyn, NY", "type": "Feature film"}, {"film": "Brighton Beach Memoirs", "year": 1986, "director": "Gene Saks", "location_label": "Prospect Park", "query": "Prospect Park, Brooklyn, NY", "type": "Feature film"}, {"film": "Coming to America", "year": 1988, "director": "John Landis", "location_label": "Brooklyn Bridge", "query": "Brooklyn Bridge, New York, NY", "type": "Feature film"}, {"film": "Coming to America", "year": 1988, "director": "John Landis", "location_label": "Hoyt–Schermerhorn Streets station", "query": "Hoyt-Schermerhorn Streets Station, Brooklyn, NY", "type": "Feature film"}, {"film": "Coming to America", "year": 1988, "director": "John Landis", "location_label": "Williamsburg apartment exterior", "query": "Williamsburg, Brooklyn, NY", "type": "Feature film"}, {"film": "Do the Right Thing", "year": 1989, "director": "Spike Lee", "location_label": "Bedford‑Stuyvesant neighborhood", "query": "Bedford-Stuyvesant, Brooklyn, NY", "type": "Feature film"}, {"film": "Do the Right Thing", "year": 1989, "director": "Spike Lee", "location_label": "Stuyvesant Avenue between Lexington Avenue and Quincy Street", "query": "Stuyvesant Avenue between Lexington Avenue and Quincy Street, Brooklyn, NY", "type": "Feature film"}, {"film": "Dog Day Afternoon", "year": 1975, "director": "Sidney Lumet", "location_label": "Prospect Park West between 17th & 18th Streets, Windsor Terrace", "query": "Prospect Park West between 17th & 18th Streets, Windsor Terrace, Brooklyn, NY", "type": "Feature film"}, {"film": "Glengarry Glen Ross", "year": 1992, "director": "James Foley", "location_label": "Sheepshead Bay", "query": "Sheepshead Bay, Brooklyn, NY", "type": "Feature film"}, {"film": "Hudson Hawk", "year": 1991, "director": "Michael Lehmann", "location_label": "Brooklyn Bridge", "query": "Brooklyn Bridge, New York, NY", "type": "Feature film"}, {"film": "Jigsaw", "year": 1949, "director": "Fletcher Markle", "location_label": "Brooklyn Museum interior", "query": "Brooklyn Museum, Brooklyn, NY", "type": "Feature film"}, {"film": "Moonstruck", "year": 1987, "director": "Norman Jewison", "location_label": "19 Cranberry St , Brooklyn Heights", "query": "19 Cranberry St, Brooklyn Heights, Brooklyn, NY", "type": "Feature film"}, {"film": "Moonstruck", "year": 1987, "director": "Norman Jewison", "location_label": "Cranberry St (Brooklyn Heights)", "query": "Cranberry St, Brooklyn Heights, Brooklyn, NY", "type": "Feature film"}, {"film": "Quick Change", "year": 1990, "director": "Bill Murray; Howard Franklin", "location_label": "175 Lorimer St, Williamsburg", "query": "175 Lorimer St, Williamsburg, Brooklyn, NY", "type": "Feature film"}, {"film": "Quick Change", "year": 1990, "director": "Bill Murray; Howard Franklin", "location_label": "Greenpoint", "query": "Greenpoint, Brooklyn, NY", "type": "Feature film"}, {"film": "Quick Change", "year": 1990, "director": "Bill Murray; Howard Franklin", "location_label": "Park Slope", "query": "Park Slope, Brooklyn, NY", "type": "Feature film"}, {"film": "Quick Change", "year": 1990, "director": "Bill Murray; Howard Franklin", "location_label": "Williamsburg", "query": "Williamsburg, Brooklyn, NY", "type": "Feature film"}, {"film": "Saturday Night Fever", "year": 1977, "director": "John Badham", "location_label": "86th Street, Bay Ridge", "query": "86th Street, Bay Ridge, Brooklyn, NY", "type": "Feature film"}, {"film": "Saturday Night Fever", "year": 1977, "director": "John Badham", "location_label": "Verrazzano-Narrows Bridge", "query": "Verrazzano-Narrows Bridge, Brooklyn, NY", "type": "Feature film"}, {"film": "She's Gotta Have It", "year": 1986, "director": "Spike Lee", "location_label": "Bedford‑Stuyvesant", "query": "Bedford-Stuyvesant, Brooklyn, NY", "type": "Feature film"}, {"film": "She's Gotta Have It", "year": 1986, "director": "Spike Lee", "location_label": "Brooklyn Heights", "query": "Brooklyn Heights, Brooklyn, NY", "type": "Feature film"}, {"film": "She's Gotta Have It", "year": 1986, "director": "Spike Lee", "location_label": "Crown Heights", "query": "Crown Heights, Brooklyn, NY", "type": "Feature film"}, {"film": "She's Gotta Have It", "year": 1986, "director": "Spike Lee", "location_label": "Downtown Brooklyn", "query": "Downtown Brooklyn, Brooklyn, NY", "type": "Feature film"}, {"film": "She's Gotta Have It", "year": 1986, "director": "Spike Lee", "location_label": "Ferry Bank Restaurant", "query": "Ferry Bank Restaurant, Brooklyn, NY", "type": "Feature film"}, {"film": "She's Gotta Have It", "year": 1986, "director": "Spike Lee", "location_label": "Fort Greene", "query": "Fort Greene, Brooklyn, NY", "type": "Feature film"}, {"film": "Sophie's Choice", "year": 1982, "director": "Alan J. Pakula", "location_label": "101 Rugby St", "query": "101 Rugby St, Brooklyn, NY 11226", "type": "Feature film"}, {"film": "Sophie's Choice", "year": 1982, "director": "Alan J. Pakula", "location_label": "Loew’s Kings Theatre", "query": "Kings Theatre, Brooklyn, NY", "type": "Feature film"}, {"film": "Sophie's Choice", "year": 1982, "director": "Alan J. Pakula", "location_label": "Prospect Park", "query": "Prospect Park, Brooklyn, NY", "type": "Feature film"}, {"film": "Sophie's Choice", "year": 1982, "director": "Alan J. Pakula", "location_label": "Prospect Park South", "query": "Prospect Park South, Brooklyn, NY", "type": "Feature film"}, {"film": "The Chosen", "year": 1981, "director": "Jeremy Paul Kagan", "location_label": "Polhemus Pl (Park Slope)", "query": "Polhemus Pl, Brooklyn, NY 11215", "type": "Feature film"}, {"film": "The Squid and the Whale", "year": 2005, "director": "Noah Baumbach", "location_label": "Midwood High School", "query": "Midwood High School, Brooklyn, NY", "type": "Feature film"}, {"film": "The Squid and the Whale", "year": 2005, "director": "Noah Baumbach", "location_label": "Park Slope", "query": "Park Slope, Brooklyn, NY", "type": "Feature film"}, {"film": "The Taking of Pelham One Two Three", "year": 1974, "director": "Joseph Sargent", "location_label": "Court Street Station", "query": "Court Street Station (New York City Subway), Brooklyn, NY", "type": "Feature film"}, {"film": "Coney Island at night", "year": null, "director": "—", "location_label": "Luna Park (Coney Island)", "query": "Luna Park, Coney Island, Brooklyn, NY", "type": "Short/actuality"}, {"film": "New Brooklyn to New York via Brooklyn Bridge, no. 2", "year": 1899, "director": "—", "location_label": "Brooklyn Bridge", "query": "Brooklyn Bridge, New York, NY", "type": "Short/actuality"}, {"film": "The diving horse", "year": 1899, "director": "—", "location_label": "Coney Island", "query": "Coney Island, Brooklyn, NY", "type": "Short/actuality"}];
    const FALLBACK = {"Bedford-Stuyvesant, Brooklyn, NY": [40.6872, -73.9418], "Bensonhurst, Brooklyn, NY": [40.6114, -73.9977], "Brighton 4th Street, Brooklyn, NY": [40.5776, -73.961], "Brooklyn Bridge, New York, NY": [40.7061, -73.9969], "Brooklyn Heights, Brooklyn, NY": [40.696, -73.9933], "Brooklyn Museum, Brooklyn, NY": [40.6712, -73.9636], "Coney Island, Brooklyn, NY": [40.5749, -73.985], "Court Street Station (New York City Subway), Brooklyn, NY": [40.6924, -73.9899], "Crown Heights, Brooklyn, NY": [40.6681, -73.9448], "Downtown Brooklyn, Brooklyn, NY": [40.6932, -73.989], "Fort Greene, Brooklyn, NY": [40.6923, -73.9743], "Greenpoint, Brooklyn, NY": [40.7245, -73.9419], "Hoyt-Schermerhorn Streets Station, Brooklyn, NY": [40.6883, -73.9853], "Kings Theatre, Brooklyn, NY": [40.649, -73.958], "Kingsboro Psychiatric Center, Brooklyn, NY": [40.6566, -73.9379], "Luna Park, Coney Island, Brooklyn, NY": [40.5743, -73.9797], "Midwood High School, Brooklyn, NY": [40.6329, -73.9583], "Park Slope, Brooklyn, NY": [40.6721, -73.9788], "Prospect Park South, Brooklyn, NY": [40.6444, -73.966], "Prospect Park, Brooklyn, NY": [40.6602, -73.969], "Sheepshead Bay, Brooklyn, NY": [40.5869, -73.954], "Verrazzano-Narrows Bridge, Brooklyn, NY": [40.6066, -74.0446], "Williamsburg, Brooklyn, NY": [40.7081, -73.9571], "86th Street, Bay Ridge, Brooklyn, NY": [40.6228, -74.0282], "Stuyvesant Avenue between Lexington Avenue and Quincy Street, Brooklyn, NY": [40.6876, -73.9358], "Polhemus Pl, Brooklyn, NY 11215": [40.6738, -73.9814], "101 Rugby St, Brooklyn, NY 11226": [40.6416, -73.9618], "175 Lorimer St, Williamsburg, Brooklyn, NY": [40.7087, -73.9531], "19 Cranberry St, Brooklyn Heights, Brooklyn, NY": [40.6995, -73.9927], "Cranberry St, Brooklyn Heights, Brooklyn, NY": [40.6997, -73.9937], "Prospect Park West between 17th & 18th Streets, Windsor Terrace, Brooklyn, NY": [40.6594, -73.9811], "Ferry Bank Restaurant, Brooklyn, NY": [40.7033, -73.9936]};

    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const toggleFeaturesEl = document.getElementById('toggleFeatures');
    const toggleShortsEl = document.getElementById('toggleShorts');
    const countFeaturesEl = document.getElementById('countFeatures');
    const countShortsEl = document.getElementById('countShorts');

    // Map
    const map = L.map('map', {
      zoomControl: true,
      preferCanvas: true
    }).setView([40.6782, -73.9442], 12);

    // Light basemap
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    const clusterFeatures = L.markerClusterGroup({ showCoverageOnHover: false, spiderfyOnMaxZoom: true });
    const clusterShorts = L.markerClusterGroup({ showCoverageOnHover: false, spiderfyOnMaxZoom: true });

    // Layer control (also mirrored by sidebar toggles)
    const overlays = {
      "Feature films": clusterFeatures,
      "Shorts / actualities": clusterShorts
    };
    L.control.layers(null, overlays, { collapsed: true }).addTo(map);

    const filmToMarkers = new Map(); // film -> markers[]
    const filmToMeta = new Map();    // film -> {year, director, type}
    const queryCache = new Map();    // query -> Promise<[lat, lon] | null>

    function popupHtml(p, resolvedQuery) {
      const safe = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const year = p.year ? `(${safe(p.year)})` : '';
      const director = p.director && p.director !== '—' ? safe(p.director) : '—';
      const locLabel = safe(p.location_label || p.query);
      const q = safe(resolvedQuery || p.query);
      const type = safe(p.type || '');
      return `
        <div>
          <div class="popupTitle">${safe(p.film)} ${year}</div>
          <div class="popupLine"><span class="popupMuted">Type:</span> ${type}</div>
          <div class="popupLine"><span class="popupMuted">Director:</span> ${director}</div>
          <div class="popupLine"><span class="popupMuted">Location:</span> ${locLabel}</div>
          <div class="popupLine popupMuted" style="margin-top:6px;">Geocode query: ${q}</div>
        </div>
      `;
    }

    async function geocodePhoton(query) {
      const url = 'https://photon.komoot.io/api/?limit=1&q=' + encodeURIComponent(query);
      const res = await fetch(url, { mode: 'cors' });
      if (!res.ok) return null;
      const j = await res.json();
      const feat = j && j.features && j.features[0];
      if (!feat || !feat.geometry || !feat.geometry.coordinates) return null;
      const [lon, lat] = feat.geometry.coordinates;
      if (typeof lat !== 'number' || typeof lon !== 'number') return null;
      return [lat, lon];
    }

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const cbName = 'cb_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        window[cbName] = (data) => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error('JSONP failed'));
        };
        function cleanup() {
          delete window[cbName];
          script.remove();
        }
        const sep = url.includes('?') ? '&' : '?';
        script.src = url + sep + 'json_callback=' + cbName;
        document.body.appendChild(script);
      });
    }

    async function geocodeNominatimJsonp(query) {
      // JSONP helps when running from file:// origins.
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
      const data = await jsonp(url);
      if (!Array.isArray(data) || !data[0]) return null;
      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      return [lat, lon];
    }

    function fallbackCoords(query) {
      if (FALLBACK[query]) return FALLBACK[query];
      // Heuristic: fall back by matching neighborhoods / landmarks inside query
      const keys = Object.keys(FALLBACK);
      const lower = query.toLowerCase();
      for (const k of keys) {
        const kl = k.toLowerCase();
        if (lower.includes(kl.split(',')[0])) return FALLBACK[k];
      }
      return null;
    }

    async function geocode(query) {
      if (queryCache.has(query)) return queryCache.get(query);
      const p = (async () => {
        try {
          // Try Photon first (fast + permissive CORS)
          const photon = await geocodePhoton(query);
          if (photon) return photon;
        } catch (e) {}
        try {
          const nom = await geocodeNominatimJsonp(query);
          if (nom) return nom;
        } catch (e) {}
        return fallbackCoords(query);
      })();
      queryCache.set(query, p);
      return p;
    }

    function addMarker(p, latlng) {
      const tooltip = p.year ? `${p.film} (${p.year})` : p.film;
      const marker = L.marker(latlng, { keyboard: false })
        .bindTooltip(tooltip, { direction: 'top', offset: [0, -6], opacity: 0.95 })
        .bindPopup(popupHtml(p, p.query), { maxWidth: 320 });

      const group = (p.type || '').toLowerCase().includes('short') ? clusterShorts : clusterFeatures;
      group.addLayer(marker);

      if (!filmToMarkers.has(p.film)) filmToMarkers.set(p.film, []);
      filmToMarkers.get(p.film).push(marker);

      if (!filmToMeta.has(p.film)) {
        filmToMeta.set(p.film, { year: p.year || null, director: p.director || '—', type: p.type || '' });
      }
    }

    function renderFilmList(filterText = '') {
      const ft = filterText.trim().toLowerCase();
      const films = Array.from(filmToMarkers.keys())
        .sort((a,b) => a.localeCompare(b));

      const frag = document.createDocumentFragment();
      listEl.innerHTML = '';

      for (const film of films) {
        if (ft && !film.toLowerCase().includes(ft)) continue;
        const meta = filmToMeta.get(film) || {};
        const markers = filmToMarkers.get(film) || [];
        const item = document.createElement('div');
        item.className = 'filmItem';
        item.dataset.film = film;

        const name = document.createElement('p');
        name.className = 'filmName';
        name.textContent = film;

        const metaP = document.createElement('p');
        metaP.className = 'filmMeta';
        const year = meta.year ? String(meta.year) : '—';
        const type = meta.type || '—';
        const count = markers.length;
        metaP.textContent = `${year} • ${type} • ${count} marker${count === 1 ? '' : 's'}`;

        item.appendChild(name);
        item.appendChild(metaP);

        item.addEventListener('click', () => {
          const ms = filmToMarkers.get(film) || [];
          if (!ms.length) return;
          const latlngs = ms.map(m => m.getLatLng());
          const bounds = L.latLngBounds(latlngs);
          map.fitBounds(bounds.pad(0.15));
          ms[0].openPopup();
        });

        frag.appendChild(item);
      }

      listEl.appendChild(frag);
    }

    function syncLayerVisibility() {
      const showFeatures = toggleFeaturesEl.checked;
      const showShorts = toggleShortsEl.checked;

      if (showFeatures) map.addLayer(clusterFeatures);
      else map.removeLayer(clusterFeatures);

      if (showShorts) map.addLayer(clusterShorts);
      else map.removeLayer(clusterShorts);
    }

    async function init() {
      statusEl.textContent = 'Geocoding locations…';

      // Count pills
      const featureCount = POINTS.filter(p => !(p.type || '').toLowerCase().includes('short')).length;
      const shortCount = POINTS.filter(p => (p.type || '').toLowerCase().includes('short')).length;
      countFeaturesEl.textContent = String(featureCount);
      countShortsEl.textContent = String(shortCount);

      // Geocode all points (deduped by query)
      const uniqueQueries = Array.from(new Set(POINTS.map(p => p.query)));

      // Concurrency-limited geocoding
      const results = new Map();
      let done = 0;
      const concurrency = 6;

      async function worker(queue) {
        while (queue.length) {
          const q = queue.shift();
          const latlng = await geocode(q);
          results.set(q, latlng);
          done++;
          statusEl.textContent = `Geocoding locations… ${done}/${uniqueQueries.length}`;
        }
      }

      const queue = uniqueQueries.slice();
      await Promise.all(Array.from({ length: concurrency }, () => worker(queue)));

      // Create markers
      let added = 0;
      for (const p of POINTS) {
        const latlng = results.get(p.query);
        if (!latlng) continue;
        addMarker(p, latlng);
        added++;
      }

      clusterFeatures.addTo(map);
      clusterShorts.addTo(map);

      // Fit to all visible markers
      const allLatLngs = [];
      clusterFeatures.eachLayer(l => allLatLngs.push(l.getLatLng()));
      clusterShorts.eachLayer(l => allLatLngs.push(l.getLatLng()));
      if (allLatLngs.length) {
        map.fitBounds(L.latLngBounds(allLatLngs).pad(0.12));
      }

      renderFilmList('');
      statusEl.textContent = `Loaded ${added} markers (${filmToMarkers.size} films).`;
      setTimeout(() => statusEl.style.display = 'none', 2200);

      // Wire up UI
      searchEl.addEventListener('input', (e) => renderFilmList(e.target.value));
      toggleFeaturesEl.addEventListener('change', syncLayerVisibility);
      toggleShortsEl.addEventListener('change', syncLayerVisibility);

      map.on('overlayadd overlayremove', () => {
        // Keep sidebar toggles consistent if user uses layer control
        toggleFeaturesEl.checked = map.hasLayer(clusterFeatures);
        toggleShortsEl.checked = map.hasLayer(clusterShorts);
      });
    }

    init();
  </script>
</body>
</html>
